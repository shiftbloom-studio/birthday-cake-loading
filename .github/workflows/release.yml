name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Detect whether this version still needs publishing
        id: release_state
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          published_version=$(npm view "$package_name" version 2>/dev/null || true)
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "published_version=$published_version" >> "$GITHUB_OUTPUT"
          if [ "$published_version" = "$package_version" ]; then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version $package_version is already on npm; skipping eager auth validation."
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $package_version is not on npm yet; trusted publishing will be used."
          fi

      - name: Create Release Pull Request or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

